name: CindraOS Stable Build

concurrency:
  group: cindraos-iso-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ['main', 'release/1.0-stable']
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Enable non-free-firmware and install build tools
        run: |
          sed -i 's/^Components: main$/Components: main non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates live-build debootstrap squashfs-tools xorriso python3 python3-pil python3-numpy file mtools dosfstools procps iproute2 pciutils qemu-system-x86 ovmf sbsigntool gh initramfs-tools-core
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Render artwork
        run: python3 scripts/render-assets.py
      - name: Run automated tests
        run: bash tests/run.sh
      - name: Check package names
        run: bash scripts/check-packages.sh
      - name: Show source version
        run: git log -1 --oneline && cat VERSION
      - name: Build ISO
        run: CINDRA_MIN_FREE_GB=8 bash build.sh
      - name: Verify ISO contents
        run: bash verify-iso.sh --deep out/CindraOS-$(tr -d '[:space:]' < VERSION)-live-amd64.iso
      - name: Boot ISO in QEMU
        run: bash tests/vm-boot.sh out/CindraOS-$(tr -d '[:space:]' < VERSION)-live-amd64.iso
      - name: Verify UEFI Secure Boot in QEMU
        run: bash tests/vm-secure-boot.sh out/CindraOS-$(tr -d '[:space:]' < VERSION)-live-amd64.iso
      - name: Upload verified ISO
        uses: actions/upload-artifact@v4
        with:
          name: cindraos-1.0.0-stable-amd64
          if-no-files-found: error
          path: |
            out/*.iso
            out/*.sha256
            out/*.packages
            out/*.contents
            out/*.log
      - name: Publish CindraOS 1.0.0 Stable release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Release CindraOS 1.0.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \\
            out/CindraOS-1.0.0-live-amd64.iso \\
            out/CindraOS-1.0.0-live-amd64.iso.sha256 \\
            --target "$GITHUB_SHA" \\
            --title "CindraOS 1.0.0 Stable" \\
            --notes-file docs/RELEASE-NOTES.md
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cindraos-build-failure-log
          path: out/*.log
          if-no-files-found: ignore
